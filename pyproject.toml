[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-pipeline"
version = "0.1.0"
description = "건설분야 콘텐츠 수집·큐레이션 파이프라인 (텔레그램 + 자체 사이트)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src", "src.collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
