# =============================================================================
# 콘텐츠 소스 선언 — 코드 수정 없이 이 파일만으로 소스 추가/제거/조정
# 새 소스를 켜기 전에 반드시 `python -m src.main verify-sources`로 확인할 것.
# =============================================================================

defaults:
  timeout: 20
  max_new_per_run: 10
  # 모든 소스에 공통 적용되는 제외어 (소스별 keyword_exclude와 합쳐짐)
  keyword_exclude: ["[부고]", "[인사]", "[결혼]", "[동정]", "[부음]"]

site:
  # GitHub Pages 주소 (저장소 공개 + Pages 활성화 후 실제 주소로 교체)
  base_url: "https://lavender-kr-official.github.io/cloud"
  title: "라벤더"
  description: "건설·토목·건축 뉴스, 입찰공고, 위원회 모집 큐레이션 아카이브"
  telegram_channel_url: "https://t.me/lavender_kr"

sources:
  # ---------------------------------------------------------------------------
  # 📰 뉴스 RSS (Phase 1) — ND소프트 CMS 계열 표준 경로 /rss/allArticle.xml
  # ---------------------------------------------------------------------------
  - id: ikld
    name: 국토일보
    type: rss
    category: news
    slots: [morning, noon, evening]
    rss:
      url: "https://www.ikld.kr/rss/allArticle.xml"
      id_pattern: "idxno=(\\d+)"
      verify_tls: false   # 실측: 서버가 중간 인증서를 보내지 않아 검증 실패 (2026-09)

  - id: conslove
    name: 한국건설신문
    type: rss
    category: news
    slots: [morning, evening]
    rss:
      # 실측(2026-09): https는 인증서 불일치 + 다른 vhost(404). 피드는 평문 http로만 제공됨
      url: "http://www.conslove.co.kr/rss/allArticle.xml"
      id_pattern: "idxno=(\\d+)"

  - id: engdaily
    name: 엔지니어링데일리
    type: rss
    category: news
    slots: [morning, noon, evening]
    rss:
      url: "https://www.engdaily.com/rss/allArticle.xml"
      id_pattern: "idxno=(\\d+)"

  - id: koscaj
    name: 대한전문건설신문
    type: rss
    category: news
    slots: [morning, evening]
    rss:
      url: "https://www.koscaj.com/rss/allArticle.xml"
      id_pattern: "idxno=(\\d+)"

  - id: constimes
    name: 건설타임즈
    type: rss
    category: news
    slots: [morning, evening]
    rss:
      url: "https://www.constimes.co.kr/rss/allArticle.xml"
      id_pattern: "idxno=(\\d+)"

  # 실측(2026-09): 국토부 RSS 목록 https://www.molit.go.kr/USR/p_etc_rsssvc/m_123/ers.jsp
  #   rss_id=NEWS 보도자료 / N01_B 고시·공고 / N04_B 자격시험 / INSA 인사 / tender 입찰공고
  #   첫 요청이 307(보안 리다이렉트) 후 200 — 간헐적으로 느려 timeout 넉넉히
  - id: molit
    name: 국토교통부 보도자료
    type: rss
    category: gov
    slots: [morning, evening]
    timeout: 40
    rss:
      url: "https://www.molit.go.kr/dev/board/board_rss.jsp?rss_id=NEWS"
      id_pattern: "id=(\\d+)"
    filters:
      keyword_exclude: ["[장관동정]", "[차관동정]"]

  - id: molit_notice
    name: 국토교통부 고시·공고
    type: rss
    category: committee
    slots: [morning]
    timeout: 40
    rss:
      url: "https://www.molit.go.kr/dev/board/board_rss.jsp?rss_id=N01_B"
      id_pattern: "idx=(\\d+)"
    filters:
      # 고시·공고 전체는 잡음이 많아(지구 지정, 인가 공고 등) 위원·공모 관련만 통과
      keyword_include: ["위원", "모집", "공모", "자문"]

  # ---------------------------------------------------------------------------
  # 🏛 협회·학회 게시판 (Phase 2) — 셀렉터는 verify-sources로 실측 후 조정
  # ---------------------------------------------------------------------------
  - id: ksce_external
    name: 대한토목학회 대외기관공고
    type: board
    category: committee
    enabled: false            # 실측(2026-09): 45초에도 무응답 — GitHub 러너(해외 IP) 차단 추정.
                              # 국내 IP 경유(릴레이/셀프호스티드 러너) 마련 시 재시도
    slots: [morning, evening]
    timeout: 45
    board:
      list_url: "https://www.ksce.or.kr/not/Default.asp?gbn=10&ctop=MN0096&htop=MN0031&ptop=MN0031&page={page}"
      pages: 1
      encoding: auto           # 구형 ASP — 실측 시 euc-kr로 고정 가능
      row_selector: "table tr:has(a)"
      skip_rows: 0
      url_base: "https://www.ksce.or.kr/not/"
      id_pattern: "bidx=(\\d+)"
      fields:
        title: {selector: "a", attr: text}
        link: {selector: "a", attr: href}
    filters:
      keyword_include: ["위원", "모집", "공모", "평가", "심의", "자문"]

  - id: aik_news
    name: 대한건축학회 건축계소식
    type: board
    category: committee
    slots: [morning, evening]
    board:
      list_url: "https://www.aik.or.kr/board/board_list.jsp?ncode=d001&page={page}"
      pages: 1
      row_selector: "table tr:has(a)"
      url_base: "https://www.aik.or.kr/board/"
      id_pattern: "num=(\\d+)"
      fields:
        title: {selector: "a", attr: text}
        link: {selector: "a", attr: href}
    filters:
      keyword_include: ["위원", "모집", "공모", "평가", "심의", "세미나", "심포지엄"]

  - id: kira_news
    name: 대한건축사협회 건축계소식
    type: board
    category: committee
    slots: [morning, evening]
    board:
      list_url: "https://www.kira.or.kr/jsp/main/01/02.jsp"
      pages: 1
      row_selector: "table tr:has(a)"
      url_base: "https://www.kira.or.kr/jsp/main/01/"
      id_pattern: "ba_id=(\\d+)"
      fields:
        title: {selector: "a", attr: text}
        # 실측(2026-09): href="javascript:fnReadArticle(264231);" → 글 번호로 상세 URL 조립
        link: {selector: "a", attr: href, pattern: "fnReadArticle\\((\\d+)\\)",
               template: "https://www.kira.or.kr/jsp/main/01/02.jsp?mode=read&ba_id={value}"}
        date: {selector: "td:nth-of-type(4)", attr: text}
    filters:
      keyword_include: ["위원", "모집", "공모", "평가", "심의", "경관"]

  - id: kpea_recom
    name: 한국기술사회 전문가 위원추천
    type: board
    category: committee
    enabled: false            # eGov .do 구조 — verify-sources 실측 후 셀렉터 확정하고 켤 것
    slots: [morning]
    board:
      list_url: "https://www.kpea.or.kr/kpea/recom/RecomList.do?leftMenuCode=member&menu=08&sub=01"
      pages: 1
      row_selector: "table tr:has(a)"
      url_base: "https://www.kpea.or.kr/kpea/recom/"
      id_pattern: "(\\d+)"
      fields:
        title: {selector: "a", attr: text}
        link: {selector: "a", attr: href}
    filters:
      keyword_include: ["위원", "모집", "추천"]

  # ---------------------------------------------------------------------------
  # 👥 위원회 모집 (Phase 4)
  # ---------------------------------------------------------------------------
  - id: calspia_turnkey
    name: 건설사업정보시스템 심의위원 모집공고
    type: board
    category: committee
    enabled: false            # POST 파라미터 실측 필요 — verify-sources 후 활성화
    slots: [morning]
    board:
      list_url: "https://www.calspia.go.kr/portal/turnkey/selectDlbMocRcrPanMng.do"
      method: POST
      form_data: {pageIndex: "{page}"}
      pages: 1
      row_selector: "table tr:has(a)"
      url_base: "https://www.calspia.go.kr/portal/turnkey/"
      id_pattern: "(\\d+)"
      fields:
        title: {selector: "a", attr: text}
        link: {selector: "a", attr: href}

  - id: lh_notice
    name: LH 공지사항
    type: board
    category: committee
    enabled: false            # board.es 구조 실측 필요
    slots: [morning]
    board:
      list_url: "https://www.lh.or.kr/board.es?mid=a10501010000&bid=0033&nPage={page}"
      pages: 1
      row_selector: "table tr:has(a)"
      url_base: "https://www.lh.or.kr/"
      id_pattern: "list_no=(\\d+)"
      fields:
        title: {selector: "a", attr: text}
        link: {selector: "a", attr: href}
    filters:
      keyword_include: ["위원", "모집", "평가", "심의", "자문"]

  # 새올 표준 게시판 — host만 바꿔 기초지자체 추가 (아래는 예시, 실측 후 활성화)
  - id: eminwon_gijang
    name: 부산 기장군 고시공고
    type: eminwon
    category: committee
    enabled: false
    slots: [morning]
    eminwon:
      host: eminwon.gijang.go.kr
      se_codes: ["01", "02"]
    filters:
      keyword_include: ["심의위원", "평가위원", "기술자문", "위원 공개모집", "위원 모집"]

  # ---------------------------------------------------------------------------
  # 📋 나라장터 입찰공고 (Phase 3) — DATA_GO_KR_KEY 시크릿 필요
  # ---------------------------------------------------------------------------
  - id: g2b_construction
    name: 나라장터 공사 입찰공고
    type: narajangteo
    category: bid
    slots: [morning, evening]
    max_new_per_run: 8
    narajangteo:
      operation: getBidPblancListInfoCnstwkPPSSrch
      extra_params: {}
    filters:
      keyword_exclude: []

  - id: g2b_engineering
    name: 나라장터 건설엔지니어링 용역
    type: narajangteo
    category: bid
    slots: [morning, evening]
    max_new_per_run: 8
    narajangteo:
      operation: getBidPblancListInfoServcPPSSrch
      extra_params: {}
    filters:
      keyword_include: ["설계", "감리", "건설사업관리", "안전진단", "타당성", "실시설계", "기본설계"]

  # ---------------------------------------------------------------------------
  # 🎬 유튜브 (Phase 5) — 채널 RSS는 API 키 불필요. channel_id(UC...)를 채워 활성화
  # ---------------------------------------------------------------------------
  - id: yt_seed_1
    name: 유튜브 시드 채널 1
    type: youtube_rss
    category: youtube
    enabled: false            # channel_id 확보 후 활성화 (docs/setup-youtube.md 참조)
    slots: [noon]
    youtube:
      channel_id: "UCxxxxxxxxxxxxxxxxxxxxxx"

  # ---------------------------------------------------------------------------
  # 📰 네이버 뉴스 API (Phase 8) — 대한경제 등 RSS 없는 제휴 매체 보완
  # ---------------------------------------------------------------------------
  - id: naver_construction
    name: 네이버 뉴스 (건설 키워드)
    type: naver_news
    category: news
    enabled: false            # NAVER_CLIENT_ID/SECRET 시크릿 등록 후 활성화
    slots: [noon]
    naver_news:
      query: "건설 입찰 OR 토목 OR 건축"
      display: 50
      domain_include: ["dnews.co.kr"]
